  <!-- ===== Auth Screen (Login / Sign up) ===== -->
  <div id="auth-screen" class="auth-screen">
    <div class="auth-box">
      <h1 class="weekly">Nota Rohya</h1>
      <div class="auth-tabs">
        <button id="tab-login" type="button" class="auth-tab active">تسجيل الدخول</button>
        <button id="tab-signup" type="button" class="auth-tab">حساب جديد</button>
      </div>
      <p id="auth-error" class="auth-error" style="display:none;"></p>
      <p id="auth-info" class="auth-info" style="display:none;"></p>

      <form id="login-form" class="auth-form">
        <input type="email" id="login-email" class="modal-input" placeholder="البريد الإلكتروني" required>
        <div class="password-field">
          <input type="password" id="login-password" class="modal-input" placeholder="كلمة السر" required>
          <button type="button" class="toggle-password" data-target="login-password" aria-label="إظهار كلمة السر">
            <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.8 21.8 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.8 21.8 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          </button>
        </div>
        <button type="submit" class="modal-save">دخول</button>
        <button type="button" id="forgot-password-btn" class="link-btn">نسيت كلمة السر؟</button>
      </form>

      <form id="signup-form" class="auth-form" style="display:none;">
        <input type="text" id="signup-name" class="modal-input" placeholder="الاسم" required>
        <input type="email" id="signup-email" class="modal-input" placeholder="البريد الإلكتروني" required>
        <div class="password-field">
          <input type="password" id="signup-password" class="modal-input" placeholder="كلمة السر (٦ أحرف على الأقل)" required minlength="6">
          <button type="button" class="toggle-password" data-target="signup-password" aria-label="إظهار كلمة السر">
            <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.8 21.8 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.8 21.8 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          </button>
        </div>
        <div class="auth-role-choice" style="display:flex; gap:16px; justify-content:center; color:#795757; margin:6px 0;">
          <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
            <input type="radio" name="signup-role" value="makhdoum" checked> مخدوم
          </label>
          <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
            <input type="radio" name="signup-role" value="khadem"> خادم
          </label>
        </div>
        <button type="submit" class="modal-save">إنشاء الحساب</button>
      </form>
    </div>
  </div>
